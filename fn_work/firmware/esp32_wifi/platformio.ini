; ESP32 WiFi 被测链路固件（R85）——拓扑/帧协议规约见 fn_docs/responsibility.md（域二十一）
; 角色：tx=发送节点（定长 UDP 流+递增 seq）/ rx=接收节点（统计+串口 KPI 帧）
[platformio]
default_envs = tx, rx

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:tx]
build_flags = -DNODE_ROLE=1

[env:rx]
build_flags = -DNODE_ROLE=2

; NRF24 被测链路固件（R86）——拓扑/帧协议规约见 fn_docs/responsibility.md（域二十一）
; 角色：reporter=发送+上报节点（PLOS/ARC/RPD+串口 KPI 帧）/ peer=对端接收
[platformio]
default_envs = reporter, peer

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.4.10

[env:reporter]
build_flags = -DNODE_ROLE=1

[env:peer]
build_flags = -DNODE_ROLE=2
